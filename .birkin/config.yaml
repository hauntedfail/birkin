# Birkin Project Specification (.birkin/config.yaml)
# Dogfooded on Birkin itself: enforced across CLI, git pre-commit, CI, Claude Code, and Hermes.
version: 1

project:
  name: birkin
  languages:
    - rust
    - lean
  exclude_globs:
    - ".git/**"
    - "**/.git/**"
    - "**/target/**"
    - "**/.lake/**"
    - "**/.birkin/ledger/**"

orientation:
  entry_docs:
    - AGENTS.md
  max_entry_doc_lines: 140
  verify_markdown_links: true
  required_docs:
    - README.md
    - LICENSE
    - birkin-policy.example.yaml
    - lean/lakefile.toml
  require_committed_spec: true
  max_review_age_days: 90

architecture:
  max_file_lines: 600
  file_line_exemptions: []
  layers:
    - name: core
      paths:
        - "src/constants.rs"
        - "src/glob.rs"
      allowed_dependencies: []
      remediation: "core modules (constants.rs, glob.rs) are Layer 0 and must not depend on internal modules."
    - name: models
      paths:
        - "src/models.rs"
        - "src/project_models.rs"
        - "src/proof_models.rs"
        - "src/workflow_models.rs"
      allowed_dependencies:
        - core
      remediation: "Model modules may only depend on core."
    - name: utils
      paths:
        - "src/config_utils.rs"
        - "src/imports_parser.rs"
        - "src/lean_kernel.rs"
        - "src/ledger.rs"
      allowed_dependencies:
        - core
        - models
      remediation: "Utility, parser, and ledger modules may only depend on core and models."
    - name: engines
      paths:
        - "src/authority_contract.rs"
        - "src/stage_contract.rs"
        - "src/review_closure.rs"
        - "src/static_check.rs"
        - "src/live.rs"
        - "src/drift.rs"
        - "src/guides.rs"
        - "src/lean_certify.rs"
        - "src/plan_contract.rs"
        - "src/project_init.rs"
        - "src/prove.rs"
        - "src/prove_audit.rs"
        - "src/prove_lean.rs"
        - "src/scope_contract.rs"
        - "src/sensors.rs"
        - "src/semantic.rs"
        - "src/verify.rs"
      allowed_dependencies:
        - core
        - models
        - utils
      remediation: "Engine modules must stay decoupled from orchestration and cli layers."
    - name: orchestration
      paths:
        - "src/client_sync.rs"
        - "src/gc.rs"
        - "src/steer.rs"
        - "src/hooks.rs"
        - "src/report.rs"
      allowed_dependencies:
        - core
        - models
        - utils
        - engines
      remediation: "Orchestration and reporting modules must not depend on cli modules."
    - name: cli
      paths:
        - "src/cli.rs"
        - "src/project_cli.rs"
        - "src/ops_cli.rs"
        - "src/workflow_cli.rs"
        - "src/workflow_stage_cli.rs"
        - "src/lib.rs"
        - "src/main.rs"
      allowed_dependencies:
        - core
        - models
        - utils
        - engines
        - orchestration
      remediation: "CLI modules may compose lower layers only."
  forbidden_imports:
    - id: no-network-in-static-or-models
      from_globs:
        - "src/authority_contract.rs"
        - "src/stage_contract.rs"
        - "src/review_closure.rs"
        - "src/constants.rs"
        - "src/glob.rs"
        - "src/models.rs"
        - "src/project_models.rs"
        - "src/proof_models.rs"
        - "src/workflow_models.rs"
        - "src/imports_parser.rs"
        - "src/lean_kernel.rs"
        - "src/lean_certify.rs"
        - "src/plan_contract.rs"
        - "src/static_check.rs"
        - "src/prove_lean.rs"
      forbid_patterns:
        - "ureq*"
        - "reqwest*"
        - "hyper*"
      message: "Pure static, schema, and parser modules must stay offline and never import HTTP clients."
      remediation: "Keep network I/O isolated to src/live.rs or src/semantic.rs."

verify:
  commands:
    - name: lean-proofs
      cmd: "cd lean && lake build"
      kind: build
      timeout_seconds: 300
    - name: cargo-clippy
      cmd: "cargo clippy --all-targets -- -D warnings"
      kind: lint
      timeout_seconds: 180
    - name: cargo-test
      cmd: "cargo test"
      kind: test
      timeout_seconds: 300
    - name: eval-rules
      cmd: "cargo run --quiet -- eval-rules"
      kind: custom
      timeout_seconds: 60
    - name: self-check
      cmd: "cargo run --quiet -- check --no-receipt"
      kind: custom
      timeout_seconds: 60
    - name: self-prove
      cmd: "cargo run --quiet -- prove --no-receipt"
      kind: custom
      timeout_seconds: 180
  check_ci_parity: true

invariants:
  forbid_secrets: true
  secret_exempt_globs:
    - "tests/**"
    - "src/sensors.rs"
  english_prose_only: true
  prose_exempt_globs:
    - "tests/**"
  forbid_debug_leftovers: true
  custom_regex_rules:
    - id: no-sorry-in-lean
      globs:
        - "lean/**/*.lean"
        - "src/**/*.lean"
      pattern: "\\bsorry\\b"
      severity: error
      message: "Unproved `sorry` placeholder found in Lean 4 formal specification."
      remediation: "Complete the formal proof without `sorry` or `axiom` shortcuts."
      examples_pass:
        - "theorem combine_comm (a b : ExitCode) : combine a b = combine b a := by cases a <;> cases b <;> rfl"
      examples_fail:
        - "theorem broken : True := by sorry"
    - id: no-println-in-engines
      globs:
        - "src/authority_contract.rs"
        - "src/stage_contract.rs"
        - "src/review_closure.rs"
        - "src/sensors.rs"
        - "src/guides.rs"
        - "src/prove.rs"
        - "src/prove_audit.rs"
        - "src/prove_lean.rs"
        - "src/lean_kernel.rs"
        - "src/lean_certify.rs"
        - "src/plan_contract.rs"
        - "src/scope_contract.rs"
        - "src/semantic.rs"
        - "src/ledger.rs"
        - "src/client_sync.rs"
        - "src/steer.rs"
        - "src/gc.rs"
        - "src/static_check.rs"
        - "src/live.rs"
        - "src/drift.rs"
      pattern: "\\bprintln!\\s*\\("
      severity: error
      message: "Engine and utility modules must return structured data rather than calling println!()."
      remediation: "Return findings or JSON values to the CLI layer instead of printing to stdout."
      examples_pass:
        - "findings.push(ProjectFinding { .. });"
        - "json!({\"status\": \"PASS\"})"
      examples_fail:
        - "println!(\"debug {}\", value);"

semantic:
  enabled: false
  base_url: "http://127.0.0.1:3425/v1"
  api_key_env: "BIRKIN_SEMANTIC_API_KEY"
  model: "auto/gemini-3.8-flash"
  timeout_seconds: 15.0
  max_diff_chars: 24000
  rules_dir: ".birkin/rules"
  rules:
    - id: no-forwarding-only-wrapper
      description: "Avoid thin forwarding abstractions that add no boundary or policy value"
      predicate: "Does this change introduce a new wrapper struct or helper that only forwards calls to one existing implementation without adding validation, policy, lifecycle, or representation translation?"
      globs:
        - "src/**/*.rs"
      threshold: 0.8
      action: advisory
      remediation: "Call the underlying module directly unless the abstraction enforces a real boundary."
      examples_pass:
        - "pub fn load_strict_spec(path: &Path) -> Result<ProjectSpec, String> { serde_yaml::from_str(&fs::read_to_string(path)?) }"
      examples_fail:
        - "pub struct SensorWrapper; impl SensorWrapper { pub fn run(r: &Path, s: &ProjectSpec) { run_project_sensors(r, s, None); } }"
    - id: fail-closed-on-provider-error
      description: "Never treat provider or parse errors as approval"
      predicate: "Does this change silently treat a network error, non-200 HTTP status, or JSON parse failure as a passing verification verdict?"
      globs:
        - "src/live.rs"
        - "src/semantic.rs"
      threshold: 0.75
      action: fix_now
      remediation: "Return EXIT_LIVE_CONTRACT or EXIT_LIVE_TRANSIENT and emit a finding; errors are never approval."
      examples_pass:
        - "Err(ureq::Error::Transport(err)) => return (EXIT_LIVE_TRANSIENT, None, Some(err.to_string()))"
      examples_fail:
        - "Err(_) => return (EXIT_PASS, None, None)"

telemetry:
  enabled: true
  thrash_threshold: 3
  thrash_window_minutes: 30
  stale_rule_min_runs: 20

proofs:
  timeout_seconds: 120
  require_zero_sorry: true
  require_standard_axioms_only: true
  prove_architecture: true
  state_machines:
    - id: admission-gate
      states: [unverified, checked, verified, proved, admitted]
      initial: unverified
      terminal: [admitted]
      transitions:
        - { from: unverified, to: checked, label: check }
        - { from: checked, to: verified, label: verify }
        - { from: verified, to: proved, label: prove }
        - { from: proved, to: admitted, label: admit }
      forbidden_transitions:
        - { from: unverified, to: admitted }
        - { from: checked, to: admitted }
      require_terminal_sink: true
      require_all_states_reachable: true
  policies:
    - id: hermes-model-access
      deny_patterns: ["*opus*"]
      allow_patterns: ["group/makima", "group/lvmh", "auto/*"]
      must_deny: ["claude-opus-5-5", "anthropic/opus"]
      must_allow: ["group/makima", "group/lvmh"]
      require_deny_dominance: true
  lean_projects:
    - name: birkin-spec
      dir: lean
      modules: [BirkinSpec]
      theorems:
        - BirkinSpec.ExitCode.combineAll_eq_pass_iff
        - BirkinSpec.birkin_six_layer_dag_acyclic
        - BirkinSpec.verifyAdmission_implies_all_matched
        - BirkinSpec.fallbackAllowed_forbidden_rejected
        - BirkinSpec.canDispatchMutating_planOnly_false
        - BirkinSpec.planValid_blocked_propagates
        - BirkinSpec.depsOrdered_acyclic
        - BirkinSpec.pathAdmitted_forbidden_dominates
        - BirkinSpec.pathAdmitted_verifyOutput_no_source_edit
        - BirkinSpec.scopeAdmitted_implies_all_in_scope
        - BirkinSpec.disjointWriteSets_conflict_false
        - BirkinSpec.dispatchAdmitted_F_requires_explicit
        - BirkinSpec.dispatchAdmitted_readonly_role_requires_R
        - BirkinSpec.dispatchAdmitted_review_requires_independence
        - BirkinSpec.dispatchAdmitted_refusal_no_escalation
        - BirkinSpec.stageAdmitted_zero_discovered_tests_false
        - BirkinSpec.stageAdmitted_committed_requires_reviewed
        - BirkinSpec.stageAdmitted_committed_requires_sawyer
        - BirkinSpec.stageAdmitted_released_requires_all
        - BirkinSpec.reviewClosureValid_resolved_without_reply_false
        - BirkinSpec.canRequestReReview_clarification_blocks
        - BirkinSpec.evalPlan_admitted_eq
        - BirkinSpec.evalPlan_rejected_nonempty
        - BirkinSpec.evalPlanDispatch_admitted_eq
        - BirkinSpec.evalScope_admitted_eq
        - BirkinSpec.evalAuthority_admitted_eq
        - BirkinSpec.evalStage_admitted_eq
        - BirkinSpec.evalReviewClosure_admitted_eq

workflow:
  enabled_contracts:
    - plan
    - scope
    - authority
    - stage
    - sawyer
    - review_closure
  require_plan_receipt: false
  toolchain_pin_files:
    - Cargo.toml
    - Cargo.lock
    - lean/lean-toolchain
  test_runners:
    - name: cargo-test
      parser: cargo_test
      require_nonzero: true
    - name: lean-proofs
      parser: lake
      require_nonzero: false
