name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install elan (Lean 4)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '[:space:]' < lean/lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(tr -d '[:space:]' < lean/lean-toolchain)"
      - name: Build Lean 4 proofs and reference oracle
        run: cd lean && lake build
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (unit, integration, and Lean differential oracle)
        run: cargo test
      - name: Calibrate Birkin rules
        run: cargo run --quiet -- eval-rules
      - name: Run Birkin self-check
        run: cargo run --quiet -- check --no-receipt
      - name: Run Birkin formal proofs
        run: cargo run --quiet -- prove --no-receipt

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install elan (Lean 4)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile elan-init.ps1
          .\elan-init.ps1 -NoPrompt $true -DefaultToolchain none
          $elanBin = Join-Path $env:USERPROFILE ".elan\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $elanBin
          $tc = (Get-Content -Raw lean/lean-toolchain).Trim()
          & (Join-Path $elanBin "elan.exe") toolchain install $tc
          & (Join-Path $elanBin "elan.exe") default $tc
      - name: Build Lean 4 proofs and birkin-kernel
        shell: pwsh
        run: |
          Push-Location lean
          lake build
          Pop-Location
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (Rust unit, Lean kernel, and integration suites)
        run: cargo test --lib --test project_engine --test parsers_and_verify --test hermes_runtime --test semantic_and_hooks --test git_workflows --test lean_kernel_and_certify --test lean_oracle_diff
      - name: Test (workflow plan and scope contracts backed by birkin-kernel)
        run: cargo test --test workflow_plan_scope --test workflow_scope_paths --test workflow_plan_schema
      - name: Test (authority, stage, and review contracts without Unix-only Sawyer fixtures)
        run: cargo test --test workflow_authority_stage_review -- --skip sawyer_
      - name: Test (workflow CLI end-to-end without Unix-only fixtures)
        run: cargo test --test workflow_cli_e2e -- --skip unix_
      - name: Test (client adapter sync and drift without Unix-only symlink fixtures)
        run: cargo test --test client_sync_and_drift -- --skip unix_
      - name: Calibrate Birkin rules
        run: cargo run --quiet -- eval-rules
      - name: Run Birkin self-check
        run: cargo run --quiet -- check --no-receipt
